<!DOCTYPE html> 
<html>
<head>
    <title>Password Checker</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=7) }}">

    <!-- Font Awesome (for eye icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="container">

    <h2>Password Strength Analyzer</h2>

    <!-- Password Input with Eye Icon -->
    <div class="password-box">
        <input type="password" id="password" placeholder="Enter password" autocomplete="off">
        <i class="fa-solid fa-eye" id="toggleIcon" onclick="togglePassword()"></i>
    </div>

    <button id="checkBtn">Check</button>

    <h3 id="score">Strength Score: -</h3>

    <div class="progress-bar">
        <div id="progress" class="progress" style="width: 0%;"></div>
    </div>

    <h3>
        Strength:
        <span id="strength">-</span>
    </h3>

    <h3>Suggestions:</h3>
    <ul id="feedback"></ul>

</div>

<script>

// 👁️ Toggle Password Visibility
function togglePassword() {
    const input = document.getElementById("password");
    const icon = document.getElementById("toggleIcon");

    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    }
}

// 🔄 Update UI Function (reusable)
function updateUI(data) {

    // 🚨 Breach alert
    if (data.breached) {
        alert("⚠️ This password has been found in real-world data breaches!");
    }

    // Score
    document.getElementById("score").innerText =
        "Strength Score: " + data.percentage + "%";

    // Progress bar
    const progress = document.getElementById("progress");
    progress.style.width = data.percentage + "%";
    progress.className = "progress " + data.strength.toLowerCase();

    // Strength text
    document.getElementById("strength").innerText = data.strength;

    // Feedback
    const feedbackList = document.getElementById("feedback");
    feedbackList.innerHTML = "";

    if (data.feedback.length === 0) {
        feedbackList.innerHTML = "<li>✅ Strong password!</li>";
    } else {
        data.feedback.forEach(item => {
            const li = document.createElement("li");
            li.innerText = item;
            feedbackList.appendChild(li);
        });
    }
}

// 📡 API Call Function
async function checkPassword(password) {

    if (!password) return;

    try {
        const response = await fetch("/check", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ password })
        });

        const data = await response.json();
        updateUI(data);

    } catch (error) {
        console.error(error);
        alert("Error connecting to server");
    }
}

// 🟡 BUTTON CLICK (for manual check)
document.getElementById("checkBtn").addEventListener("click", function () {
    const password = document.getElementById("password").value;

    if (!password) {
        alert("Please enter a password");
        return;
    }

    checkPassword(password);
});

// 🟢 REAL-TIME CHECK (with debounce)
let timeout;

document.getElementById("password").addEventListener("input", function () {

    const password = this.value;

    clearTimeout(timeout);

    timeout = setTimeout(() => {
        checkPassword(password);
    }, 400); // delay = smoother UX
});

</script>

</body>
</html>
