<!DOCTYPE html> 
<html>
<head>
    <title>Password Checker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=10) }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- 🌗 Theme Toggle -->
    <div class="theme-toggle">
        <i class="fa-solid fa-moon" onclick="toggleTheme()"></i>
    </div>

    <h2>Password Strength Analyzer</h2>

    <!-- Password Input -->
    <div class="password-box">
        <input type="password" id="password" placeholder="Enter password" autocomplete="off">
        <i class="fa-solid fa-eye" id="toggleIcon" onclick="togglePassword()"></i>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
        <button id="checkBtn">Check</button>
        <button onclick="generatePassword()">Generate</button>
        <button onclick="copyPassword()">Copy</button>
    </div>

    <h3 id="score">Strength Score: -</h3>

    <!-- Progress -->
    <div class="progress-bar">
        <div id="progress" class="progress"></div>
    </div>

    <!-- Strength Badge -->
    <h3>Strength: <span id="strength" class="badge">-</span></h3>

    <h3 id="entropy">Entropy: -</h3>

    <h3>Suggestions:</h3>
    <ul id="feedback"></ul>

    <!-- 📜 History -->
    <h3>Recent Checks:</h3>
    <ul id="history"></ul>

</div>

<script>

// 🌗 THEME TOGGLE
function toggleTheme() {
    document.body.classList.toggle("light-mode");
}

// 👁️ PASSWORD TOGGLE
function togglePassword() {
    const input = document.getElementById("password");
    const icon = document.getElementById("toggleIcon");

    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    }
}

// 🔐 GENERATE PASSWORD
function generatePassword() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
    let password = "";

    for (let i = 0; i < 12; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    document.getElementById("password").value = password;
    checkPassword(password);
}

// 📋 COPY PASSWORD
function copyPassword() {
    const input = document.getElementById("password");

    if (!input.value) {
        alert("Nothing to copy!");
        return;
    }

    navigator.clipboard.writeText(input.value);
    alert("Copied!");
}

// 📜 SAFE HISTORY (no password stored)
function addToHistory(strength, percentage) {
    const history = document.getElementById("history");

    const li = document.createElement("li");
    li.innerText = `Strength: ${strength} (${percentage}%)`;

    history.prepend(li);

    // Limit history to 5
    if (history.children.length > 5) {
        history.removeChild(history.lastChild);
    }
}

// 🔄 UPDATE UI
function updateUI(data) {

    if (data.breached) {
        alert("⚠️ This password has been found in data breaches!");
    }

    document.getElementById("score").innerText =
        "Strength Score: " + data.percentage + "%";

    const progress = document.getElementById("progress");
    progress.style.width = data.percentage + "%";
    progress.className = "progress " + data.strength.toLowerCase();

    const strengthEl = document.getElementById("strength");
    strengthEl.innerText = data.strength;
    strengthEl.className = "badge " + data.strength.toLowerCase();

    document.getElementById("entropy").innerText =
        "Entropy: " + data.entropy + " bits";

    const feedbackList = document.getElementById("feedback");
    feedbackList.innerHTML = "";

    if (data.feedback.length === 0) {
        feedbackList.innerHTML = "<li>✅ Strong password!</li>";
    } else {
        data.feedback.forEach(item => {
            const li = document.createElement("li");
            li.innerText = item;
            feedbackList.appendChild(li);
        });
    }

    addToHistory(data.strength, data.percentage);
}

// 📡 API CALL
async function checkPassword(password) {

    if (!password) return;

    try {
        const res = await fetch("/check", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ password })
        });

        const data = await res.json();
        updateUI(data);

    } catch {
        alert("Server error");
    }
}

// BUTTON
document.getElementById("checkBtn").addEventListener("click", () => {
    const password = document.getElementById("password").value;
    if (!password) return alert("Enter password");
    checkPassword(password);
});

// REAL-TIME
let timeout;
document.getElementById("password").addEventListener("input", function () {
    clearTimeout(timeout);
    timeout = setTimeout(() => checkPassword(this.value), 400);
});

function updateUI(data) {
    // Strength Badge
    const strengthEl = document.getElementById("strength");
    strengthEl.innerText = data.strength;
    strengthEl.className = "badge " + data.strength.toLowerCase();

    // Entropy & Crack Time
    document.getElementById("entropy").innerText = `Entropy: ${data.entropy} bits`;
    document.getElementById("score").innerText = `Time to Crack: ${data.crack_time}`;

    // Progress Bar
    const progress = document.getElementById("progress");
    progress.style.width = data.percentage + "%";
    progress.className = "progress " + data.strength.toLowerCase();

    // Smart Feedback
    const feedbackList = document.getElementById("feedback");
    feedbackList.innerHTML = data.feedback.map(item => `<li>${item}</li>`).join('');
}

</script>

</body>
</html>
